name: Build PasteOrbit for macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing Release tag (empty uses the application version)'
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          host: mac
          target: desktop
          arch: clang_64
          # QtSvg 已包含在基础安装包中，不能作为额外模块安装。
          cache: true
      - name: Configure and build
        run: |
          cmake --preset macos -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          cmake --build --preset macos-release --parallel 3
      - name: Verify encryption, storage and backup
        run: ctest --test-dir build/macos --output-on-failure
      - name: Deploy Qt and package
        run: |
          app="$PWD/build/macos/bin/Release/PasteOrbit.app"
          macdeployqt "$app" -always-overwrite -codesign=-
          codesign --verify --deep --strict "$app"
          # DMG 中提供应用和 Applications 入口，用户拖放即可安装。
          staging="$PWD/build/macos/dmg"
          mkdir -p "$staging" dist
          ditto "$app" "$staging/PasteOrbit.app"
          ln -sfn /Applications "$staging/Applications"
          hdiutil create -volname PasteOrbit -srcfolder "$staging" -ov -format UDZO "dist/PasteOrbit-macos-${{ matrix.arch }}.dmg"
          hdiutil verify "dist/PasteOrbit-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: PasteOrbit-macos-${{ matrix.arch }}
          path: dist/PasteOrbit-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish:
    name: Attach macOS packages to Release
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: PasteOrbit-macos-*
          merge-multiple: true
          path: dist
      - name: Upload Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          version=$(sed -nE 's/^set\(PASTEORBIT_VERSION "([^"]+)".*/\1/p' CMakeLists.txt)
          tag="$RELEASE_TAG_INPUT"
          if [[ -z "$tag" ]]; then
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then tag="$GITHUB_REF_NAME"; else tag="v$version"; fi
          fi
          if [[ "$tag" != "v$version" ]]; then
            echo "::error::Release tag $tag does not match application version $version"
            exit 1
          fi
          # 标签构建与 Windows 发布并行；等它创建 Release，不创建或改动已有发布说明。
          for attempt in {1..30}; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release upload "$tag" dist/PasteOrbit-macos-*.dmg --clobber --repo "$GITHUB_REPOSITORY"
              exit 0
            fi
            if [[ "$GITHUB_REF_TYPE" != tag ]]; then break; fi
            sleep 10
          done
          echo "::error::Release $tag is not available; create it before running this workflow manually."
          exit 1
