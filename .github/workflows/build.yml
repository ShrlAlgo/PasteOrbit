name: Build PasteOrbit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build native application
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Qt and MinGW
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg

      - name: Configure
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ucrt = Join-Path $env:MSYS2_ROOT 'ucrt64'
          $bin = Join-Path $ucrt 'bin'
          $env:PATH = "$bin;$env:PATH"
          & (Join-Path $bin 'cmake.exe') -S . -B "$env:RUNNER_TEMP\PasteOrbit-native-build" -G Ninja `
            -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$ucrt" `
            "-DCMAKE_CXX_COMPILER=$(Join-Path $bin 'g++.exe')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $bin = Join-Path $env:MSYS2_ROOT 'ucrt64\bin'
          $env:PATH = "$bin;$env:PATH"
          & (Join-Path $bin 'cmake.exe') --build "$env:RUNNER_TEMP\PasteOrbit-native-build" --parallel 4
