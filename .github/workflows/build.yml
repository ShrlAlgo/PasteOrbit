name: Build PasteOrbit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build native application
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Qt and MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg

      - name: Configure
        shell: pwsh
        run: |
          $env:PATH = 'C:\msys64\ucrt64\bin;C:\msys64\usr\bin;' + $env:PATH
          cmake -S . -B "$env:RUNNER_TEMP\PasteOrbit-native-build" -G Ninja -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release
        shell: pwsh
        run: |
          $env:PATH = 'C:\msys64\ucrt64\bin;C:\msys64\usr\bin;' + $env:PATH
          cmake --build "$env:RUNNER_TEMP\PasteOrbit-native-build" --parallel 4
