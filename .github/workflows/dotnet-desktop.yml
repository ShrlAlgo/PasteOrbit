name: Package PasteOrbit

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish
        id: publish
        shell: pwsh
        run: |
          $releaseTag = $env:GITHUB_REF_NAME
          if ($releaseTag -notmatch '^v\d+\.\d+\.\d+$') {
            throw '发布标签必须使用 v<主版本>.<次版本>.<补丁版本> 格式。'
          }

          git merge-base --is-ancestor $env:GITHUB_SHA origin/master
          if ($LASTEXITCODE -ne 0) {
            throw '发布标签必须指向 master 分支上的提交。'
          }

          $version = $releaseTag.Substring(1)
          .\Scripts\Publish.ps1 -Version $version

          $archive = Get-ChildItem -LiteralPath .\artifacts -Filter 'PasteOrbit-*.zip' -File |
            Select-Object -First 1
          if ($null -eq $archive) {
            throw '未找到发布压缩包。'
          }

          "archive=$($archive.FullName)" >> $env:GITHUB_OUTPUT
          "package_version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT

      - name: Build installer
        id: installer
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.publish.outputs.package_version }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup 安装失败，退出代码：$LASTEXITCODE"
            }
          }

          $languageDirectory = Join-Path $PWD 'Scripts\Languages'
          $chineseLanguageFile = Join-Path $languageDirectory 'ChineseSimplified.isl'
          New-Item -ItemType Directory -Force -Path $languageDirectory | Out-Null
          if (-not (Test-Path -LiteralPath $chineseLanguageFile -PathType Leaf)) {
            Invoke-WebRequest `
              -Uri 'https://raw.githubusercontent.com/jrsoftware/issrc/is-6_7_1/Files/Languages/Unofficial/ChineseSimplified.isl' `
              -OutFile $chineseLanguageFile
          }

          if (-not (Test-Path -LiteralPath $chineseLanguageFile -PathType Leaf)) {
            throw "未找到 Inno Setup 中文语言文件：$chineseLanguageFile"
          }

          & $iscc "/DAppVersion=$env:PACKAGE_VERSION" '.\Scripts\Installer.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup 编译失败，退出代码：$LASTEXITCODE"
          }

          $installer = Join-Path $PWD "artifacts\PasteOrbit-$env:PACKAGE_VERSION-Setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "未找到安装程序：$installer"
          }

          "installer=$installer" >> $env:GITHUB_OUTPUT

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: PasteOrbit-win-x64
          path: |
            ${{ steps.publish.outputs.archive }}
            ${{ steps.installer.outputs.installer }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.publish.outputs.release_tag }}
          ARCHIVE_PATH: ${{ steps.publish.outputs.archive }}
          INSTALLER_PATH: ${{ steps.installer.outputs.installer }}
        run: |
          $commitLog = (git log -1 --pretty=%B $env:GITHUB_SHA | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($commitLog)) {
            $commitLog = "Release $env:RELEASE_TAG"
          }

          $arguments = @(
            'release'
            'create'
            $env:RELEASE_TAG
            $env:ARCHIVE_PATH
            $env:INSTALLER_PATH
            '--repo'
            $env:GITHUB_REPOSITORY
            '--title'
            $env:RELEASE_TAG
            '--notes'
            $commitLog
            '--generate-notes'
          )

          $arguments += '--verify-tag'

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release 发布失败，退出代码：$LASTEXITCODE"
          }
