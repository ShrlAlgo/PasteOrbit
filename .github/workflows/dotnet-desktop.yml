name: Package PasteOrbit

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.2.0
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish
        id: publish
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $releaseTag = $env:GITHUB_REF_NAME
            $version = $releaseTag.TrimStart('v', 'V')
          }
          else {
            $version = $env:REQUESTED_VERSION.Trim()
            if ([string]::IsNullOrWhiteSpace($version)) {
              throw '手动发布必须填写版本号。'
            }

            $releaseTag = if ($version.StartsWith('v', [StringComparison]::OrdinalIgnoreCase)) {
              $version
            }
            else {
              "v$version"
            }
            $version = $version.TrimStart('v', 'V')
          }

          .\Scripts\Publish.ps1 -Version $version

          $archive = Get-ChildItem -LiteralPath .\artifacts -Filter 'PasteOrbit-*.zip' -File |
            Select-Object -First 1
          if ($null -eq $archive) {
            throw '未找到发布压缩包。'
          }

          "archive=$($archive.FullName)" >> $env:GITHUB_OUTPUT
          "package_version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT

      - name: Build installer
        id: installer
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.publish.outputs.package_version }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup 安装失败，退出代码：$LASTEXITCODE"
            }
          }

          $innoArguments = @("/DAppVersion=$env:PACKAGE_VERSION")
          $chineseLanguageFile = Join-Path (Split-Path -Parent $iscc) 'Languages\ChineseSimplified.isl'
          if (Test-Path -LiteralPath $chineseLanguageFile -PathType Leaf) {
            $innoArguments += '/DIncludeChinese'
          }
          else {
            Write-Warning "未找到 ChineseSimplified.isl，将生成英文安装程序。"
          }

          $innoArguments += '.\Scripts\Installer.iss'
          & $iscc @innoArguments
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup 编译失败，退出代码：$LASTEXITCODE"
          }

          $installer = Join-Path $PWD "artifacts\PasteOrbit-$env:PACKAGE_VERSION-Setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "未找到安装程序：$installer"
          }

          "installer=$installer" >> $env:GITHUB_OUTPUT

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: PasteOrbit-win-x64
          path: |
            ${{ steps.publish.outputs.archive }}
            ${{ steps.installer.outputs.installer }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.publish.outputs.release_tag }}
          ARCHIVE_PATH: ${{ steps.publish.outputs.archive }}
          INSTALLER_PATH: ${{ steps.installer.outputs.installer }}
        run: |
          $arguments = @(
            'release'
            'create'
            $env:RELEASE_TAG
            $env:ARCHIVE_PATH
            $env:INSTALLER_PATH
            '--repo'
            $env:GITHUB_REPOSITORY
            '--title'
            $env:RELEASE_TAG
            '--generate-notes'
          )

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $arguments += '--verify-tag'
          }
          else {
            $arguments += @('--target', $env:GITHUB_SHA)
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release 发布失败，退出代码：$LASTEXITCODE"
          }
